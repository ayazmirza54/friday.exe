<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'; media-src blob:">
<title>Friday</title>
<style>
	:root { --bg: rgba(22, 23, 29, 0.96); --fg: #f2f2f5; --dim: #9d9daa; --accent: #7aa2ff; --err: #ff8a8a; --line: rgba(255,255,255,0.09); }
	html, body { margin: 0; height: 100%; background: transparent; font: 15px 'Segoe UI Variable Text', 'Segoe UI', sans-serif; color: var(--fg); overflow: hidden; user-select: none; }
	.bar { position: absolute; inset: 10px; background: var(--bg); border-radius: 18px; border: 1px solid var(--line);
		box-shadow: 0 10px 36px rgba(0,0,0,0.5); padding: 14px 18px 12px; display: flex; flex-direction: column; gap: 6px; -webkit-app-region: drag;
		animation: rise 140ms ease-out; }
	@keyframes rise { from { transform: translateY(8px); opacity: 0; } }
	.row { display: flex; align-items: center; gap: 14px; }
	.meter { display: flex; align-items: center; gap: 3px; width: 34px; height: 24px; flex: none; }
	.meter i { flex: 1; height: 4px; border-radius: 3px; background: var(--dim); transition: height 70ms linear, background 200ms; }
	.listening .meter i { background: var(--accent); }
	.working .meter i { background: var(--accent); animation: think 1s ease-in-out infinite; }
	.working .meter i:nth-child(2) { animation-delay: 0.12s; } .working .meter i:nth-child(3) { animation-delay: 0.24s; }
	.working .meter i:nth-child(4) { animation-delay: 0.36s; } .working .meter i:nth-child(5) { animation-delay: 0.48s; }
	.error .meter i { background: var(--err); }
	@keyframes think { 50% { height: 16px; } }
	@media (prefers-reduced-motion: reduce) { .bar, .working .meter i { animation: none; } }
	input { flex: 1; min-width: 0; background: transparent; border: none; outline: none; color: var(--fg); font: inherit; font-size: 18px; -webkit-app-region: no-drag; }
	input::placeholder { color: var(--dim); }
	.status { color: var(--dim); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-height: 18px; }
	.reply { font-size: 15px; line-height: 1.45; max-height: 66px; overflow-y: auto; -webkit-app-region: no-drag; user-select: text; }
	.error .reply { color: var(--err); }
	.foot { display: flex; justify-content: space-between; align-items: center; color: var(--dim); font-size: 11px; }
	.foot button { -webkit-app-region: no-drag; background: none; border: none; color: var(--accent); font: inherit; cursor: pointer; padding: 0; display: none; }
	.error .foot button { display: inline; }
	kbd { font: inherit; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
</style>
</head>
<body>
<div class="bar" id="bar">
	<div class="row">
		<div class="meter" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
		<input id="input" placeholder="Listening… or type" aria-label="Your request" autocomplete="off" spellcheck="false">
	</div>
	<div class="status" id="status" aria-live="polite"></div>
	<div class="reply" id="reply" aria-live="polite"></div>
	<div class="foot"><button id="details">Open Friday for details</button><span><kbd>Enter</kbd> send · <kbd>Esc</kbd> stop</span></div>
</div>
<script src="mic.js"></script>
<script>
const $ = (id) => document.getElementById(id)
const input = $('input'), status = $('status'), reply = $('reply'), bar = $('bar')
const bars = [...document.querySelectorAll('.meter i')]
let state = 'idle' // idle | listening | working | error
let isEdited = false
let isStreaming = true
let mic = null
let config = {}
let hideTimer = null
let player = null

function setState(next) {
	state = next
	bar.className = 'bar ' + next
	if (next !== 'listening') bars.forEach((b) => (b.style.height = ''))
}

function showLevel(level) {
	const shape = [0.45, 0.8, 1, 0.8, 0.45]
	bars.forEach((b, i) => (b.style.height = `${4 + Math.round(level * 20 * shape[i])}px`))
}

function stopSpeaking() {
	speechSynthesis.cancel()
	player?.pause()
	player = null
}
const isSpeaking = () => speechSynthesis.speaking || (player != null && !player.paused)

async function listen() {
	clearTimeout(hideTimer)
	stopSpeaking()
	input.value = ''
	isEdited = false
	reply.textContent = ''
	status.textContent = ''
	input.focus()
	setState('listening')
	const started = await window.friday.listen()
	if (started.error != null) {
		status.textContent = started.error
		return
	}
	isStreaming = started.isStreaming
	try {
		mic = await window.openMic({ onPcm: (pcm) => window.friday.pcm(pcm), onLevel: (l) => state === 'listening' && showLevel(l) })
	} catch {
		window.friday.cancel()
		status.textContent = 'No microphone. Allow desktop apps to use it in Windows Settings → Privacy → Microphone, or type.'
	}
}

async function send() {
	if (state !== 'listening') return
	mic?.close()
	mic = null
	if (!isStreaming && !isEdited) {
		setState('working')
		status.textContent = 'Transcribing…'
	}
	const heard = await window.friday.finish()
	if (heard.error != null) {
		setState('error')
		reply.textContent = heard.error
		return
	}
	const text = (isEdited ? input.value : heard.text || input.value).trim()
	if (text === '') {
		cancel()
		return
	}
	input.value = text
	setState('working')
	status.textContent = 'Thinking…'
	window.friday.say(text)
}

function cancel() {
	mic?.close()
	mic = null
	window.friday.cancel()
	stopSpeaking()
	setState('idle')
	window.friday.hide()
}

async function speak(text) {
	stopSpeaking()
	if (config.textToSpeech === 'off') return scheduleHide()
	if (config.textToSpeech === 'server') {
		const r = await window.friday.speakServer(text)
		if (r.error != null) {
			status.textContent = `Voice server: ${r.error}`
			return scheduleHide()
		}
		player = new Audio(URL.createObjectURL(new Blob([r.audio], { type: 'audio/mpeg' })))
		player.onended = () => state !== 'working' && scheduleHide()
		player.play()
		return
	}
	const u = new SpeechSynthesisUtterance(text)
	const voice = speechSynthesis.getVoices().find((v) => v.name === config.voice)
	if (voice != null) u.voice = voice
	u.rate = config.voiceRate ?? 1
	u.onend = () => state !== 'working' && scheduleHide()
	speechSynthesis.speak(u)
}

function scheduleHide() {
	clearTimeout(hideTimer)
	hideTimer = setTimeout(() => state !== 'listening' && state !== 'working' && !isSpeaking() && window.friday.hide(), state === 'error' ? 15000 : 6000)
}

input.addEventListener('input', () => (isEdited = true))
input.addEventListener('keydown', (e) => {
	clearTimeout(hideTimer) // the user is here: stay open
	if (e.key === 'Enter') {
		e.preventDefault()
		if (state === 'listening') send()
		else if (isEdited && input.value.trim() !== '') { setState('listening'); send() } // typed a follow-up
		else listen()
	} else if (e.key === 'Escape') {
		e.preventDefault()
		if (isSpeaking()) stopSpeaking()
		else if (state === 'working') { window.friday.interrupt(); status.textContent = 'Stopped.'; setState('idle') }
		else cancel()
	}
})
$('details').addEventListener('click', () => window.friday.openWindow('home'))

window.friday.on('open', listen)
window.friday.on('hotkey', () => (state === 'listening' ? send() : listen()))
window.friday.on('config', (c) => (config = c))
window.friday.on('transcript', (text) => {
	if (!isEdited) input.value = text
})
window.friday.on('problem', (message) => (status.textContent = `${message} You can type instead.`))
window.friday.on('brain', (event) => {
	switch (event.type) {
		case 'tool':
			status.textContent = event.summary ? `${event.name}: ${event.summary}` : event.name
			break
		case 'screen':
			status.textContent = `Looking at your screen: ${event.reason}`
			break
		case 'task':
			status.textContent = `Task “${event.name}” ${event.status}`
			break
		case 'result':
			if (event.isInterrupted) break
			reply.textContent = event.text
			if (event.isError) setState('error')
			else if (event.job == null && !event.isDelegated) status.textContent = ''
			speak(event.text)
			break
		case 'idle':
			if (state === 'working') setState('idle')
			if (!isSpeaking()) scheduleHide()
			break
	}
})
</script>
</body>
</html>
